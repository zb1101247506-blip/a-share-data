name: Stock Data Crawler Full

on:
  schedule:
    # 第一次触发：UTC 00:21（北京时间 08:21）
    - cron: '21 0 * * 1-5'
    # 第二次备用触发：UTC 00:33（北京时间 08:33）
    - cron: '33 0 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-full-market:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖并抓取全量数据
        run: |
          pip install --quiet akshare requests pandas
          python crawler.py

      - name: 提交并推送最新数据
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "update full morning data [skip ci]" || echo "无变动"
          git push
